# Deploy Pages cyvoriq-www (no Codespaces)

# Manual run: GitHub → Actions → Deploy cyvoriq-www Pages → Run workflow
# Secret: repo Settings → Secrets and variables → Actions →
#   CLOUDFLARE_API_TOKEN = the user token named cyvoriq-mobile
#   (needs Account Cloudflare Pages Edit)
# Never put ADMIN_API_TOKEN, RESEND_*, or Neon URLs here.
# Never deploy to cyvra-www or cyvra-mobile from this workflow.

name: Deploy cyvoriq-www Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web for api.cyvoriq.co.in
        env:
          VITE_API_URL: https://api.cyvoriq.co.in
        run: pnpm --filter @cyvra/web build
      - name: Deploy Pages cyvoriq-www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5a3eeb2b3d42726a8ba08732464a0eda
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . scripts/sanitize-cf-token.sh
          pnpm --filter @cyvra/api exec wrangler whoami
          cd services/api
          pnpm exec wrangler pages project create cyvoriq-www --production-branch=main || true
          pnpm exec wrangler pages deploy ../../apps/web/dist \
            --project-name=cyvoriq-www \
            --commit-dirty=true
      - name: Remind custom domains
        run: |
          echo "After first deploy: Pages → cyvoriq-www → Custom domains"
          echo "  www.cyvoriq.co.in and apex cyvoriq.co.in"
          echo "Do not attach those hosts to Worker cyvra-mobile-api."
