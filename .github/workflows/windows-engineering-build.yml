# Windows Engineering Build — FIRST INTEGRATED ENGINEERING BUILD
#
# Runs this repository's automated test suites, builds the existing Tauri desktop
# application for Windows on a Windows runner, packages the installers, verifies
# that the executable and installers really exist, and uploads them.
#
# Build order (P6/P7):
#   1. install JS deps
#   2. typecheck + bundle the P5 React UI
#   3. stage the payload (`:host:installDist`, `jlink` runtime, `platform-tools`)
#      and assert all three components are present
#   4. run every test suite, then `cargo test` / `cargo build`
#   5. `tauri build` (its beforeBuildCommand re-stages, then bundles)
#   6. gates: installed-layout `--selftest` must print SELFTEST_OK with
#      `readyToScan=true`, and the packaged artifact set must exceed 100 MB,
#      proving the payload is inside the shipped files.
#
# Artifact policy:
#   * UNSIGNED ENGINEERING ARTIFACT — this repository has no code-signing
#     infrastructure. No signing step is performed and none is simulated.
#     Do not present this artifact as a signed or commercial release.
#   * Generated binaries (apps/desktop/src-tauri/target/) are never committed;
#     CI produces and uploads them instead.
#
# The workflow fails if any test suite fails, if the app fails to build, or if
# the expected Windows artifacts are missing after the build.

name: Windows Engineering Build

on:
  push:
    branches: [phase2-correct, feature/p2-protocol-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-engineering-build:
    name: Test, build & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain setup mirrors the repository's existing workflows
      # (pnpm 12.3.4 / Node 24) plus the Gradle JDK 21 freeze.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Java (Temurin 21 — repository Gradle freeze)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The P5 UI is compiled again by `beforeBuildCommand` during
      # `tauri build`, but a type error there surfaces late and behind the
      # bundler. Typecheck and bundle the React app explicitly so a broken
      # bridge call site fails here, before the long Rust release build.
      - name: Compile P5 React UI (typecheck + production bundle)
        working-directory: apps/desktop
        run: pnpm run build

      # Staging must happen before any Cargo step: tauri-build resolves
      # `bundle.resources` at compile time, and `cargo test` runs before
      # `tauri build`'s beforeBuildCommand gets a chance to stage anything.
      # This also produces the `:host:installDist` distribution that the
      # runtime-resolution tests assert on.
      - name: Stage installer payload (Host dist, Java runtime, platform-tools)
        working-directory: apps/desktop
        run: pnpm stage:resources

      # Fail fast, and before any Cargo step, if one of the three payload
      # components is missing. A silently empty .resources/ still produces a
      # green `tauri build`; without this gate the only proof that the
      # payload was bundled would arrive after the full release build.
      - name: Assert staged payload (Host dist, jlink runtime, platform-tools)
        run: |
          $ErrorActionPreference = 'Stop'
          $res = "apps/desktop/src-tauri/.resources"
          $required = @(
            @{ Path = (Join-Path $res "host/lib");          Label = ":host:installDist JARs" },
            @{ Path = (Join-Path $res "runtime/bin/java.exe"); Label = "jlink Java runtime" },
            @{ Path = (Join-Path $res "platform-tools/adb.exe"); Label = "platform-tools adb" }
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item.Path)) {
              Write-Host "::error::Staged payload missing $($item.Label): $($item.Path)"
              exit 1
            }
          }
          $bytes = [int64]((Get-ChildItem $res -Recurse -File | Measure-Object -Property Length -Sum).Sum)
          Write-Host ("Staged payload OK ({0:N0} bytes): Host JARs + jlink runtime + platform-tools." -f $bytes)

      # --- Tests: any failure fails the workflow -------------------------
      - name: Run core tests (contract, S1 collector, reconciliation, Report 1 derivation)
        working-directory: apps/android
        run: ./gradlew.bat :core:test --console=plain

      - name: Run host tests (S2 provider, report/sanitization engines, integrated workflow)
        working-directory: apps/android
        run: ./gradlew.bat :host:test --console=plain

      - name: Compile Android app (S1 device-side integration)
        working-directory: apps/android
        run: ./gradlew.bat :app:compileDebugKotlin --console=plain

      - name: Run desktop Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Explicit compile gate for the P5 bridge. `cargo test` builds the test
      # profile, so this is incremental, but it asserts that the crate still
      # builds as a binary in the same profile the installer ships and keeps
      # the failure message distinguishable from a test failure.
      - name: Compile desktop Rust bridge (cargo build)
        working-directory: apps/desktop/src-tauri
        run: cargo build

      # --- Build & package the real Windows application (unsigned) -------
      # `beforeBuildCommand` runs `pnpm stage:resources`, which produces
      # :host:installDist, a jlink Java runtime and platform-tools under
      # src-tauri/.resources, then `bundle.resources` copies them into the
      # installer. The installer is therefore self-contained: no JDK, no
      # Android SDK and no source checkout are required on the target machine.
      - name: Build & package Windows desktop application (Tauri)
        working-directory: apps/desktop
        run: pnpm exec tauri build

      # --- P1 gate: prove the packaged layout runs on a clean machine ------
      - name: Verify installed layout (Host boots from the bundled runtime)
        run: |
          $ErrorActionPreference = 'Stop'

          $release = "apps/desktop/src-tauri/target/release"
          $exe     = Join-Path $release "cyvra-mobile-desktop.exe"
          $staged  = "apps/desktop/src-tauri/.resources"
          $sim     = Join-Path $release "installed-sim"

          if (-not (Test-Path (Join-Path $staged "host/lib"))) {
            Write-Host "::error::Staged resources missing: $staged/host/lib"
            exit 1
          }

          # A shipped executable must never embed the development Host tree. The
          # pre-fix binary resolved the Host from CARGO_MANIFEST_DIR, so every
          # installed copy reported HOST_NOT_BUILT pointing back into the build
          # workspace. `cyvra-mobile-host` only exists in that source layout.
          # (Tauri does legitimately embed its own tauri.conf.json path, which
          # also lives under src-tauri, so the workspace path is not a valid
          # needle - only the development Host distribution is.)
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($needle in @("cyvra-mobile-host", "host\build\install", "CARGO_MANIFEST_DIR")) {
            if (-not [string]::IsNullOrWhiteSpace($needle) -and $text.Contains($needle)) {
              Write-Host "::error::Shipped executable embeds the development Host tree: $needle"
              exit 1
            }
          }

          # Reproduce the installer layout: executable plus resources/ together.
          if (Test-Path $sim) { Remove-Item $sim -Recurse -Force }
          New-Item -ItemType Directory -Path $sim -Force | Out-Null
          Copy-Item $exe $sim -Force
          Copy-Item $staged (Join-Path $sim "resources") -Recurse -Force

          # Nothing the build machine has on PATH may satisfy the runtime:
          # only what the installer actually ships may be used.
          Remove-Item Env:JAVA_HOME  -ErrorAction SilentlyContinue
          Remove-Item Env:CYVRA_HOME -ErrorAction SilentlyContinue

          $out = Join-Path $sim "selftest.out"
          $err = Join-Path $sim "selftest.err"

          $process = Start-Process -FilePath (Join-Path $sim "cyvra-mobile-desktop.exe") `
                      -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow `
                      -RedirectStandardOutput $out -RedirectStandardError $err

          $report = (@(Get-Content $out -ErrorAction SilentlyContinue) +
                     @(Get-Content $err -ErrorAction SilentlyContinue)) -join "`n"
          Write-Host $report

          if ($process.ExitCode -ne 0 -or $report -notmatch "SELFTEST_OK") {
            Write-Host "::error::Installed-layout selftest failed (exit $($process.ExitCode)). The installer would not run on a clean machine."
            exit 1
          }

          # P6 gate: SELFTEST_OK alone is not enough. The Host must also have
          # answered preflight with readyToScan=true, i.e. the bundled JVM,
          # bundled adb and Host JARs all resolved from resources/ and every
          # critical preflight check passed. `run_selftest` already refuses to
          # print SELFTEST_OK when ready is false; this asserts the literal
          # wire value so a regression cannot pass unnoticed.
          if ($report -notmatch "readyToScan=true") {
            Write-Host "::error::Selftest did not report readyToScan=true. Preflight is not green on the installed layout."
            Write-Host $report
            exit 1
          }

          foreach ($expected in @("runtime\bin\java.exe", "platform-tools\adb.exe")) {
            if ($report -notlike "*$expected*") {
              Write-Host "::error::Selftest did not resolve the bundled $expected"
              exit 1
            }
          }

          Write-Host "Installed layout verified: bundled Java runtime and adb resolved from resources/."

      # --- P7 gate: the payload must really be inside the shipped files ---
      - name: Verify Windows artifacts exist and carry the payload (> 100 MB)
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "apps/desktop/src-tauri/target/release"
          $exe = Join-Path $releaseDir "cyvra-mobile-desktop.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Missing Windows executable: $exe"
            exit 1
          }
          $msi = @(Get-ChildItem "$releaseDir/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem "$releaseDir/bundle/nsis" -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue)
          if (($msi.Count + $nsis.Count) -eq 0) {
            Write-Host "::error::No installer bundle was produced (msi/nsis)"
            exit 1
          }

          # The bare executable is only the Rust binary (~10 MB): the Host
          # JARs, the jlink Java runtime and platform-tools are carried by
          # the installers. If any of those stopped being staged, the set
          # collapses well below this floor, so the total size is the proof
          # that the 100 MB+ payload was bundled.
          $files = @($exe) + @($msi | ForEach-Object { $_.FullName }) + @($nsis | ForEach-Object { $_.FullName })
          $total = [int64]0
          foreach ($file in $files) { $total += (Get-Item $file).Length }

          $floor = [int64]100MB
          if ($total -lt $floor) {
            Write-Host ("::error::Packaged artifact set is {0:N0} bytes, expected more than {1:N0}. The installer payload was NOT bundled." -f $total, $floor)
            exit 1
          }

          Write-Host "Verified Windows artifacts (UNSIGNED ENGINEERING ARTIFACT):"
          foreach ($file in $files) {
            $item = Get-Item $file
            Write-Host ("  {0}  {1} bytes" -f $item.FullName, $item.Length)
          }
          Write-Host ("P7 payload gate OK: {0:N0} bytes across {1} artifact(s), floor {2:N0} bytes." -f $total, $files.Count, $floor)

      - name: Upload unsigned engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyvra-mobile-windows-unsigned-engineering-artifact
          path: |
            apps/desktop/src-tauri/target/release/cyvra-mobile-desktop.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
