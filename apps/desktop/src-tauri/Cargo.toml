[package]
name = "cyvra-mobile-desktop"
version = "0.1.0"
description = "CYVRA Mobile Windows Desktop Workstation"
authors = ["CYVORIQ Solutions Pvt Ltd"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# Licence transport (W1.5).
#
# `default-features = false` drops `default-tls`, so the binary links no
# OpenSSL and no SecureChannel/Schannel binding: TLS is `rustls` + webpki
# roots, which builds identically on every target and ships no system TLS
# dependency. `blocking` is required because `LicenseApiClient` is a
# synchronous trait (api.rs:147-163) and every call already runs off the
# async runtime on `tauri::async_runtime::spawn_blocking` (commands.rs:106).
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
# Property-based testing for the state machines (ledger chain, activation
# transitions). Used only under `cargo test`, never linked into a shippable
# bundle.
proptest = "1"
# In-process HTTP server for the licence-client tests, and the async runtime
# it needs. Dev-only: neither reaches a shippable bundle.
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_PortableDevices",
    "Win32_Devices_Usb",
    "Win32_Foundation",
    "Win32_System_Com",
    # Activation layer: DPAPI for the device token at rest.
    "Win32_Security_Cryptography",
    # Activation layer: machine fingerprint (registry MachineGuid,
    # raw SMBIOS firmware table, system-volume serial).
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }
