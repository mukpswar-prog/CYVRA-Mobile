org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Otter 2 cannot use AGP 9 built-in Kotlin (needs Otter 3). Official opt-out
# restores the old DSL so kotlin-android can load. Remove for AGP 10.
android.builtInKotlin=false
android.newDsl=false
